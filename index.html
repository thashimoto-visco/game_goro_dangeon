<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吾郎の不思議なダンジョン</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="game-panel">
        <h1>吾郎の不思議なダンジョン</h1>
        <p class="subtitle">矢印キー or WASD で移動 / <kbd>Space</kbd> で足踏み</p>
        <canvas id="game" width="640" height="480" aria-label="ゲーム画面"></canvas>
      </section>

      <aside class="ui-panel">
        <h2>ステータス</h2>
        <dl>
          <div><dt>階層</dt><dd id="floor">1F</dd></div>
          <div><dt>HP</dt><dd id="hp">20 / 20</dd></div>
          <div><dt>攻撃</dt><dd id="atk">5</dd></div>
          <div><dt>守備</dt><dd id="def">2</dd></div>
          <div><dt>満腹度</dt><dd id="hunger">100</dd></div>
          <div><dt>経験値</dt><dd id="exp">0</dd></div>
        </dl>

        <h2>ログ</h2>
        <ul id="log" class="log"></ul>
      </aside>
    </main>

    <script src="main.js"></script>
  </body>
</html>
