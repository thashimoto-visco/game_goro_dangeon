<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype 3 — 吾郎 idle方向比較</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #11151c;
      color: #edf2f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; min-height: 100vh; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; color: #aeb8c6; }
    .samples { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 24px; }
    .sample {
      padding: 16px;
      border: 1px solid #2c3543;
      border-radius: 12px;
      background: #171d26;
    }
    .sample h2 { margin: 0 0 12px; font-size: 14px; color: #d7dee9; }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 256px;
      height: 224px;
      overflow: hidden;
      background-color: #313847;
      background-image:
        linear-gradient(rgb(9 12 17 / 15%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(9 12 17 / 15%) 1px, transparent 1px),
        url("../../../assets/tiles/floor_01.svg");
      background-size: 32px 32px;
    }
    .shadow {
      position: absolute;
      left: 50%;
      top: 60%;
      width: 44px;
      height: 18px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgb(8 11 18 / 42%);
      filter: blur(2px);
    }
    .goro {
      position: relative;
      display: block;
      width: 55px;
      height: 100px;
      object-fit: fill;
    }
    .legend {
      margin-top: 10px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #8f9bad;
    }
  </style>
</head>
<body>
  <h1>吾郎 idle方向比較 — Prototype 3</h1>
  <p>55 × 100pxで、頭身・肩幅・足元アンカー・方向の読みやすさを比較する。</p>
  <main class="samples">
    <section class="sample">
      <h2>idle-down（画面下へ正対）</h2>
      <div class="stage">
        <span class="shadow" aria-hidden="true"></span>
        <img class="goro" src="../../../assets/actors/goro/runtime/goro-idle-down-v3.webp" alt="下向きの吾郎">
      </div>
      <div class="legend">goro-idle-down-v3.webp</div>
    </section>
    <section class="sample">
      <h2>idle-up（画面上へ正対）</h2>
      <div class="stage">
        <span class="shadow" aria-hidden="true"></span>
        <img class="goro" src="../../../assets/actors/goro/runtime/goro-idle-up-v2.webp" alt="上向きの吾郎">
      </div>
      <div class="legend">goro-idle-up-v2.webp</div>
    </section>
  </main>
</body>
</html>
