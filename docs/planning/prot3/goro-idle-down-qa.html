<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype 3 — 吾郎 idle-down 表示確認</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #11151c;
      color: #edf2f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px;
      min-height: 100vh;
    }

    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; color: #aeb8c6; }

    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 24px;
    }

    .sample {
      padding: 16px;
      border: 1px solid #2c3543;
      border-radius: 12px;
      background: #171d26;
    }

    .sample h2 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: #d7dee9;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 256px;
      height: 224px;
      overflow: hidden;
      background-color: #313847;
      background-image:
        linear-gradient(rgb(9 12 17 / 15%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(9 12 17 / 15%) 1px, transparent 1px),
        url("../../../assets/tiles/floor_01.svg");
      background-size: 32px 32px, 32px 32px, 32px 32px;
      image-rendering: auto;
    }

    .shadow {
      position: absolute;
      left: 50%;
      top: 60%;
      width: 44px;
      height: 18px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgb(8 11 18 / 42%);
      filter: blur(2px);
    }

    .goro {
      position: relative;
      display: block;
      width: 55px;
      height: 100px;
      object-fit: fill;
    }

    .sample--double .goro {
      width: 110px;
      height: 200px;
    }

    .sample--double .shadow {
      width: 88px;
      height: 36px;
    }

    .legend {
      margin-top: 10px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #8f9bad;
    }
  </style>
</head>
<body>
  <h1>吾郎 idle-down — Prototype 3</h1>
  <p>真下向き、B案の顔つき、約3頭身。床タイル上で透過縁と縮小時の可読性を確認する。</p>

  <main class="samples">
    <section class="sample">
      <h2>ゲーム想定サイズ（55 × 100 px）</h2>
      <div class="stage">
        <span class="shadow" aria-hidden="true"></span>
        <img class="goro" src="../../../assets/actors/goro/runtime/goro-idle-down-v3.webp" alt="真下を向く吾郎">
      </div>
      <div class="legend">render: 55 × 100 / floor grid: 32 px</div>
    </section>

    <section class="sample sample--double">
      <h2>2倍表示（輪郭確認）</h2>
      <div class="stage">
        <span class="shadow" aria-hidden="true"></span>
        <img class="goro" src="../../../assets/actors/goro/runtime/goro-idle-down-v3.webp" alt="真下を向く吾郎の2倍表示">
      </div>
      <div class="legend">render: 110 × 200 / source: lossless WebP</div>
    </section>
  </main>
</body>
</html>
